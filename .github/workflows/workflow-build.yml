name: Reusable - Build

on:
  workflow_call:
    inputs:
      aws-region:
        description: 'AWS region for SAM template validation'
        required: false
        type: string
        default: 'eu-west-1'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests with coverage
        run: ./gradlew :streaming-core:test :streaming-core:koverHtmlReport :streaming-core:koverVerify :streaming-s3-example:test -PexcludeTags=integration

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: streaming-core/build/reports/kover/html/

  validate-sam:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Validate SAM template
        env:
          AWS_DEFAULT_REGION: ${{ inputs.aws-region }}
        run: sam validate --template-file deployment/aws/sam/template.yaml --region ${{ inputs.aws-region }}
